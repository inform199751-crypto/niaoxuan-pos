<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>鳥璇點餐系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F2F0EB; --surface:#FFFFFF; --sunk:#E8E4DC; --ink:#1E1B18; --muted:#6F675E; --line:#DCD7CE;
  --tare:#7A3E12; --tare-soft:#F1E4D6; --ember:#C8421F; --ember-ink:#FFFFFF; --ok:#2F7A4B; --ok-soft:#E1F0E6;
  --warn:#B7791F; --bad:#B42318; --bad-soft:#FBE7E4;
  --shadow:0 10px 30px rgba(40,25,10,.14);
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ground:#151210; --surface:#201C19; --sunk:#2A2420; --ink:#EFE9E1; --muted:#A39A8F; --line:#3A332D;
  --tare:#E2A15E; --tare-soft:#3A2A1C; --ember:#E8643A; --ember-ink:#1A0E08; --ok:#6CC58F; --ok-soft:#1C2E22;
  --warn:#E0B050; --bad:#F07A6A; --bad-soft:#3A1E1A; --shadow:0 10px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#151210; --surface:#201C19; --sunk:#2A2420; --ink:#EFE9E1; --muted:#A39A8F; --line:#3A332D;
  --tare:#E2A15E; --tare-soft:#3A2A1C; --ember:#E8643A; --ember-ink:#1A0E08; --ok:#6CC58F; --ok-soft:#1C2E22;
  --warn:#E0B050; --bad:#F07A6A; --bad-soft:#3A1E1A; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}

/* ---- 頂列 ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--ground)}
.top-in{max-width:1240px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:8px}
.logo{font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.12em}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs button{flex:none;border:0;background:none;color:inherit;opacity:.65;padding:8px 12px;border-radius:6px;font-weight:500;position:relative}
.tabs button[aria-selected="true"]{opacity:1;background:rgba(255,255,255,.12)}
.tabs .pip{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--ember);color:var(--ember-ink);font-family:var(--mono);font-size:12px;text-align:center}
.conn{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid currentColor;opacity:.85;white-space:nowrap}
.conn.shared{color:#8FD6A8}.conn.local{color:#F2C46B}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
.banner{background:var(--tare-soft);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}

/* ---- 桌位 chips ---- */
.tablebar{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.tchip{min-height:64px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;line-height:1.25}
.tchip b{font-size:22px;font-family:var(--serif)}
.tchip small{font-size:13px;color:var(--muted)}
@media (max-width:480px){.tablebar{grid-template-columns:repeat(3,1fr)}}
.tchip.dining{border-color:var(--tare);background:var(--tare-soft)}
.tchip[aria-pressed="true"]{outline:2px solid var(--ember);outline-offset:1px}

/* ---- 點餐版面 ---- */
.order{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px;align-items:start}
.opencard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px}
.opencard h3{margin:0;font-family:var(--serif);font-size:18px;flex-basis:100%}
nav.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:5;background:var(--ground);display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
nav.cats a{flex:none;text-decoration:none;color:var(--muted);font-size:14px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
section.cat{padding-top:10px;scroll-margin-top:110px}
section.cat h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:0;display:flex;align-items:baseline;gap:10px}
section.cat h2 small{font-family:var(--sans);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.1em}
.items{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 22px}
.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.item .nm{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.3}
.item .jp{font-size:12px;color:var(--muted)}
.item .pr{font-family:var(--mono);font-size:15px;color:var(--tare);font-weight:600;text-align:right}
.item .ctl{grid-column:1/-1;justify-self:end}
.item.has{background:linear-gradient(90deg,var(--tare-soft),transparent 85%)}
.item.out{opacity:.45}
.item.out .ctl::before{content:"今日售完";font-size:12px;color:var(--bad)}

.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.step button{width:36px;height:36px;border:0;background:none;font-size:18px;line-height:1}
.step button:hover{background:var(--tare-soft)}
.step button:disabled{opacity:.3;cursor:default;background:none}
.step output{min-width:28px;text-align:center;font-family:var(--mono);font-weight:600}
.add{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--tare);background:none;color:var(--tare);font-weight:700}
.add:hover{background:var(--tare);color:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
aside.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.ph{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph h3{margin:0;font-family:var(--serif);font-size:18px}
.pb{overflow-y:auto;padding:4px 16px;flex:1}
.line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.line .q{color:var(--muted)}
.line.void{color:var(--muted);text-decoration:line-through}
.pf{padding:12px 16px 14px;border-top:2px solid var(--ink);display:grid;gap:8px}
.pf textarea{width:100%;font-size:13px;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical;min-height:38px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.row.big{font-size:15px;font-weight:700}
.row.big .num{font-size:22px}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--tare);transition:width .25s}
.meter.met i{background:var(--ok)}
.btn{height:46px;border-radius:8px;border:1px solid var(--ink);background:none;font-weight:700;font-size:15px;padding:0 16px}
.btn.primary{background:var(--ember);border-color:var(--ember);color:var(--ember-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.small{height:34px;font-size:13px;padding:0 12px}
.btn:disabled{opacity:.35;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---- 廚房 ---- */
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.ticket{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--tare);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.ticket.late{border-top-color:var(--bad)}
.ticket.mid{border-top-color:var(--warn)}
.ticket .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ticket .th b{font-family:var(--serif);font-size:22px}
.ticket .age{font-family:var(--mono);font-size:14px;color:var(--muted)}
.ticket.late .age{color:var(--bad);font-weight:600}
.ticket ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ticket li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:20px;font-weight:500}
.ticket li .num{font-weight:600}
.ticket li button.it{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--ground)}
.ticket li button.it:focus-visible{outline:2px solid var(--ember)}
.ticket li button.it.part{background:var(--tare-soft);border-color:var(--tare)}
.ticket li button.it.done{text-decoration:line-through;color:var(--muted);background:var(--ok-soft);border-color:var(--ok)}
.ticket li .cnt{font-family:var(--mono);font-size:16px;white-space:nowrap}
.ticket li.voided{text-decoration:line-through;color:var(--muted);font-size:16px;padding:0 10px}
.ticket .sub{font-size:13px;color:var(--muted)}
.kds-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.recent{margin-top:24px}
.gtag{display:inline-block;font-size:11px;line-height:1.4;padding:0 6px;border-radius:4px;background:var(--ember);color:var(--ember-ink);vertical-align:1px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qrprev{max-height:46vh;overflow:auto}
.qrprev .qrcard{cursor:pointer}
.qrcard{border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center;display:grid;gap:4px;background:#fff;color:#000}
.qrcard svg{width:100%;height:auto;max-width:180px;margin:0 auto}
.qrshop{font-size:12px;letter-spacing:.3em}
.qrtbl{font-size:22px}
.qrhint{font-size:12px}
.qrurl{font-size:9px;color:#666;word-break:break-all}
@media print{
  #print.qrsheet{padding:10mm}
  #print.qrsheet .qrgrid{grid-template-columns:repeat(3,1fr);gap:8mm}
  #print.qrsheet .qrcard{border:1px dashed #999;padding:5mm;break-inside:avoid}
  #print.qrsheet .qrcard svg{max-width:55mm}
  #print.qrsheet .qrtbl{font-size:26px}
  #print.qrsheet .qrhint{font-size:13px}
}
.recent .row{padding:6px 0;border-bottom:1px dashed var(--line)}
.ticket .nt{background:var(--tare-soft);border-radius:6px;padding:6px 8px;font-size:14px}
.soldout{margin-top:26px}
.soldout h3{font-family:var(--serif);font-size:17px;margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}

/* ---- 桌況 ---- */
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;display:grid;gap:2px}
.tcard.dining{border-left-color:var(--tare)}
.tcard .id{font-family:var(--serif);font-size:18px;font-weight:600;display:flex;justify-content:space-between}
.tcard .st{font-size:12px;color:var(--muted)}
.tcard .amt{font-family:var(--mono);color:var(--tare);font-weight:600}
.tcard .pend{font-size:12px;color:var(--warn)}
.tcard[aria-pressed="true"]{outline:2px solid var(--ember);outline-offset:1px}
.tcard.drag-src{opacity:.4}
.tcard.drop-ok{outline:3px dashed var(--ember);outline-offset:2px;background:var(--tare-soft)}
.drag-ghost{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--ground);padding:6px 12px;border-radius:8px;font-weight:700;box-shadow:var(--shadow);transform:translate(12px,12px)}
@media (hover:hover){.floor .tcard{cursor:grab}}
.billgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:18px;align-items:start}
.round{font-size:12px;color:var(--muted);padding-top:10px}
.x{border:0;background:none;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:4px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pays button{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:14px}
.pays button[aria-pressed="true"]{border-color:var(--ember);background:var(--tare-soft);font-weight:700}
.warnbox{background:var(--tare-soft);border-radius:6px;padding:8px 10px;font-size:13px}

/* ---- 日結 ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
h2.sec{font-family:var(--serif);font-size:18px;margin:0 0 8px}
.bar{height:8px;border-radius:4px;background:var(--tare);display:block;min-width:2px}
.hot{display:inline-flex;align-items:center;gap:1px;margin-left:6px;vertical-align:2px}
.hot .crown{width:20px;height:15px}
.hot .hotn{font-family:var(--mono);font-size:11px;color:#9A6A00;font-weight:600}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:6px}
.podium div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.podium .crown{width:30px;height:22px}
.podium b{font-family:var(--serif);font-size:20px;font-weight:600}
details.hist{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
details.hist summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px}

/* ---- 對話層 / 提示 ---- */
.overlay{position:fixed;inset:0;background:rgba(15,10,6,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.sheet{background:var(--surface);color:var(--ink);border-radius:12px;max-width:440px;width:100%;max-height:86vh;overflow:auto;padding:22px;box-shadow:var(--shadow);display:grid;gap:12px}
.sheet h3{margin:0;font-family:var(--serif);font-size:20px}
.sheet textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:14px;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

.mbar{display:none}
@media (max-width:900px){
  .order,.billgrid,.two{grid-template-columns:1fr}
  aside.cart{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:14px 14px 0 0;max-height:84vh;z-index:30;transform:translateY(105%);transition:transform .25s;padding-bottom:env(safe-area-inset-bottom,0px)}
  aside.cart.open{transform:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ember);color:var(--ember-ink);border:0;width:100%;justify-content:space-between;align-items:center;font-weight:700}
  .mbar strong{font-family:var(--mono);font-size:18px}
  .scrim{position:fixed;inset:0;background:rgba(15,10,6,.45);z-index:28}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* 點餐畫面不用粗體(店家要求) */
#app.ordview *,.mbar,.mbar *{font-weight:400!important}

/* ---- 列印明細(熱感紙) ---- */
#print{display:none}
@media print{
  @page{margin:0}
  body{background:#fff!important}
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#000;background:#fff;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:12px;line-height:1.45;padding:3mm 2mm}
  #print .rc-shop{font-size:20px;font-weight:700;text-align:center;letter-spacing:.3em}
  #print .rc-title{text-align:center;font-size:13px;margin-bottom:4px}
  #print .rc-hr{border-top:1px dashed #000;margin:5px 0}
  #print .rc-hr2{border-top:2px solid #000;margin:5px 0}
  #print table{width:100%;border-collapse:collapse;font-size:12px}
  #print td{padding:1px 0;vertical-align:top;border:0;white-space:normal;background:none}
  #print td.q{text-align:center;width:3em}
  #print td.a{text-align:right;width:5em}
  #print .rc-row{display:flex;justify-content:space-between;gap:6px}
  #print .rc-total{font-size:16px;font-weight:700}
  #print .rc-foot{text-align:center;font-size:11px;margin-top:6px}
}
</style>

<header class="top">
  <div class="top-in">
    <span class="logo">鳥璇</span>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <span class="conn local" id="conn">連線中…</span>
  </div>
</header>

<div class="wrap" id="app"></div>

<button class="mbar" id="mbar" hidden><span id="mbarL"></span><span>本輪 <strong id="mbarR">0</strong> 元</span></button>
<div class="scrim" id="scrim" hidden></div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<div id="print" aria-hidden="true"></div>

const EXP_CATS = ["食材","酒水飲料","炭火燃料","耗材包材","人事","房租水電","雜支"];
const EXP_SRC = [["drawer","收銀機現金"],["other","其他(老闆代墊、轉帳)"]];   // 從抽屜拿的錢,點鈔時要扣掉
// id 固定寫死:改桌數時不會讓進行中的訂單對到別張桌
const DEFAULT_TABLES = [["t01","吧台1"],["t02","吧台2"],["t03","吧台3"],["t04","吧台4"],

/* ============ 工具 ============ */
const $ = s=>document.querySelector(s);

const rid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function bizDay(d=new Date()){ const x=new Date(d); x.setHours(x.getHours()-DAY_CUTOFF_HOUR);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function lsGet(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ============ 資料層:共用資料庫,拿不到就退回單機 ============ */
const COLS = ["tables","orders","settles","days","config","shift","expenses"];
/* ============ 資料層 ============
   三種模式,依開啟方式自動選:
   server = 店內電腦跑 server.py,手機連 Wi-Fi 打開(不用任何帳號,多台同步)
   shared = 發布在 claude.ai 的共用網頁
   local  = 直接開 html 檔,資料只存在這台 */
const store = {
  mode:"local", db:null, local:Object.assign(Object.fromEntries(COLS.map(c=>[c,{}])),lsGet("nx-local",{})), subs:{},
  ver:-1, snap:null,
  async put(col,id,data){ if(this.mode==="server") return this._op({op:"put",col,id,data});
    if(this.db) return this.db.collection(col).doc(id).set(data);
    this.local[col][id]=data; this._flush(col); },
  async patch(col,id,data){ if(this.mode==="server") return this._op({op:"patch",col,id,data});
    if(this.db) return this.db.collection(col).doc(id).update(data);
    this.local[col][id]={...(this.local[col][id]||{}),...data}; this._flush(col); },
  async del(col,id){ if(this.mode==="server") return this._op({op:"del",col,id});
    if(this.db) return this.db.collection(col).doc(id).delete();
    delete this.local[col][id]; this._flush(col); },
  watch(col,cb){ this.subs[col]=cb;
    if(this.mode==="server"){ if(this.snap) cb(this._docs(this.snap,col)); return; }
    if(this.db) return this.db.collection(col).onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))), e=>{ console.warn(col,e); if(e.code==="revoked") setConn("local","已離線"); });
    cb(Object.entries(this.local[col]).map(([id,v])=>({...v,id}))); },
  _flush(col){ lsSet("nx-local",this.local); this.subs[col]&&this.subs[col](Object.entries(this.local[col]).map(([id,v])=>({...v,id}))); },
  _docs(data,col){ return Object.entries(data[col]||{}).map(([id,v])=>({...v,id})); },
  _apply(st){ if(st.data){ const prev=this.snap||{}; this.snap=st.data; this.ver=st.version;
      Object.entries(this.subs).forEach(([c,cb])=>{ if(JSON.stringify(prev[c])!==JSON.stringify(st.data[c])) cb(this._docs(st.data,c)); }); } },
  async _op(body){ const r=await fetch("api/op",{method:"POST",headers:{"Content-Type":"application/json","X-PIN":lsGet("nx-pin","")},body:JSON.stringify(body)});
    if(r.status===401){ askPin(); throw {code:"server",message:"需要店員密碼"}; }
    if(!r.ok) throw {code:"server",message:await r.text()}; this._apply(await r.json()); },

    try{ const r=await fetch("api/state?v="+this.ver,{cache:"no-store",headers:{"X-PIN":lsGet("nx-pin","")}});

    setTimeout(()=>this._poll(),1500); }
};

  tab: lsGet("nx-tab","order"), sound: lsGet("nx-sound",false), sel: null, bill: null, method: "cash", drawer:false };

  const t=T(id); if(!t) return null;
  const merged={}; sessionOrders(id).forEach(o=>o.lines.forEach(l=>{ if(l.q>0){ merged[l.id] ||= {...l,q:0}; merged[l.id].q+=l.q; } }));

const cart = id => { const c=(carts[id] ||= {items:{},note:""}); c.custom ||= {}; return c; };

  ...Object.entries(cart(id).custom).filter(([k,v])=>v.q>0).map(([k,v])=>({id:k,name:v.name,price:v.price,q:v.q,custom:true}))];
const hiddenPresets = ()=> S.config.main?.hidden || [];

/* ============ 畫面 ============ */
const TABS=[["order","點餐"],["kitchen","內場"],["floor","桌況・結帳"],["close","日結"],["books","記帳"]];

  const keep={}; document.querySelectorAll("#app input[id],#app select[id]").forEach(el=>keep[el.id]=el.value);
  const act=document.activeElement, actId=act&&act.id&&/^(INPUT|TEXTAREA|SELECT)$/.test(act.tagName)?act.id:null;
  const caret=actId&&act.type!=="number"&&act.tagName!=="SELECT"?act.selectionStart:null;
  const keepY=window.scrollY; $("#app").innerHTML=(store.mode==="local"?`<div class="banner">單機模式:資料只存在這台裝置,其他手機看不到。要多台同步,請在店裡電腦打開「鳥璇點餐系統.exe」,手機用它畫面上的網址連線。</div>`:"")+v();
  window.scrollTo(0,keepY);
  Object.entries(keep).forEach(([id,v])=>{ const el=document.getElementById(id); if(el) el.value=v; });
  if(actId){ const el=document.getElementById(actId); if(el){ el.focus(); if(caret!=null) try{ el.setSelectionRange(caret,caret); }catch(e){} } }
  const showBar = S.tab==="order" && S.sel && T(S.sel);
  $("#mbar").hidden=!showBar;

}

/* ---- 記帳 ---- */
/* 品項賣出統計:份數佔比看「哪道最常被點」,金額佔比看「哪道最會賺」,兩個不一定一樣 */
const CROWN_SVG='<svg class="crown" viewBox="0 0 24 18" aria-hidden="true"><path d="M2 15 1 4l6 5 5-8 5 8 6-5-1 11z" fill="#E8B10C" stroke="#9A6A00" stroke-width="1.2" stroke-linejoin="round"/><rect x="2" y="15" width="20" height="2.4" rx="1" fill="#C98F00"/></svg>';
const crownTag=r=>`<span class="hot" title="近 30 天熱賣第 ${r} 名">${CROWN_SVG}<span class="hotn">${r}</span></span>`;
function hotTop3(){
  const since=bizDay(new Date(Date.now()-29*864e5)), menuNames=new Set(Object.values(ITEM).map(i=>i.name)), q={};
  S.days.filter(d=>d.id>=since).forEach(d=>(d.items||[]).forEach(([n,v])=>{ if(menuNames.has(n)) q[n]=(q[n]||0)+v; }));
  S.settles.forEach(x=>x.lines.forEach(l=>{ if(menuNames.has(l.name)) q[l.name]=(q[l.name]||0)+l.q; }));
  return Object.entries(q).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
}
const hotRank=name=>{ const i=hotTop3().findIndex(([n])=>n===name); return i<0?0:i+1; };

function itemShare(qty, amt){
  const names=Object.keys(qty), tq=names.reduce((a,n)=>a+qty[n],0)||1, ta=names.reduce((a,n)=>a+(amt[n]||0),0)||1;
  return names.map(n=>({name:n, q:qty[n], a:amt[n]||0, qp:qty[n]/tq*100, ap:(amt[n]||0)/ta*100})).sort((x,y)=>y.q-x.q||y.a-x.a);
}
const pct=v=>(v>=10?Math.round(v):Math.round(v*10)/10)+"%";

/* ============ 換桌・併桌 ============ */
// 訂單是跟著「這一次開桌(session)」走的,所以換桌只要把桌子資料搬過去;
// 單上的桌名跟著改,明細才對得上。
async function relabelPending(session,tableId,label){
  for(const o of S.orders.filter(o=>o.session===session))
    await store.patch("orders",o.id,{table:tableId,tableLabel:label});
}
async function moveTable(from,to){
  const {id:_old,...t}=T(from);   // 不要把舊桌號一起複製過去
  await store.put("tables",to,t);
  for(const m of t.merged||[]) await store.put("tables",m,{status:"merged",into:to});
  await store.put("tables",from,{status:"free"});
  if(carts[from]){ carts[to]=carts[from]; delete carts[from]; saveCarts(); }
  await relabelPending(t.session,to,[baseLabel(to),...(t.merged||[]).map(baseLabel)].join("+"));
}
async function mergeTables(main,other){
  const t=T(main), o=T(other);
  const merged=[...new Set([...(t.merged||[]),other,...((o&&o.merged)||[])])];
  const label=[baseLabel(main),...merged.map(baseLabel)].join("+");
  const log={...(t.mergeLog||{})};
  if(o) log[other]={session:o.session,people:o.people,cork:o.cork||0,openedAt:o.openedAt,merged:o.merged||[],
    mergeLog:o.mergeLog||null,orders:S.orders.filter(x=>x.session===o.session).map(x=>x.id)};
  await store.patch("tables",main,{merged,mergeLog:log,
    people:t.people+(o?o.people:0), cork:(t.cork||0)+((o&&o.cork)||0)});
  if(o){
    for(const x of S.orders.filter(x=>x.session===o.session))
      await store.patch("orders",x.id,{session:t.session,table:main,tableLabel:label});
    for(const m of o.merged||[]) await store.put("tables",m,{status:"merged",into:main});
    if(carts[other]){ const c=cart(main), oc=cart(other);   // 還沒送出的暫存點單也併過來
      Object.entries(oc.items).forEach(([k,q])=>c.items[k]=(c.items[k]||0)+q);
      Object.entries(oc.custom).forEach(([k,v])=>{ c.custom[k] ||= {...v,q:0}; c.custom[k].q+=v.q; });
      delete carts[other]; saveCarts(); }
  }
  await store.put("tables",other,{status:"merged",into:main});
  await relabelPending(t.session,main,label);
}
// 拆桌:原本有點餐的桌子,把它的人數、開瓶費、訂單還回去;空桌併入的直接放回空桌。
// 併桌之後才點的單無法分辨是誰的,會留在主桌。
async function splitTable(main,other){
  const t=T(main), rec=t.mergeLog?.[other], log={...(t.mergeLog||{})}; delete log[other];
  const back=rec?[other,...(rec.merged||[])]:[other];
  const merged=(t.merged||[]).filter(x=>!back.includes(x));
  const label=[baseLabel(main),...merged.map(baseLabel)].join("+");
  await store.patch("tables",main,{merged,mergeLog:log,
    people:Math.max(1,t.people-(rec?rec.people:0)), cork:Math.max(0,(t.cork||0)-(rec?rec.cork:0))});
  if(!rec){ await store.put("tables",other,{status:"free"}); return; }
  const otherLabel=[baseLabel(other),...(rec.merged||[]).map(baseLabel)].join("+");
  await store.put("tables",other,{status:"dining",people:rec.people,cork:rec.cork,session:rec.session,openedAt:rec.openedAt,
    merged:rec.merged||[],...(rec.mergeLog?{mergeLog:rec.mergeLog}:{})});
  for(const m of rec.merged||[]) await store.put("tables",m,{status:"merged",into:other});
  for(const x of S.orders.filter(x=>rec.orders.includes(x.id)))
    await store.patch("orders",x.id,{session:rec.session,table:other,tableLabel:otherLabel});
  await relabelPending(t.session,main,label);
}
async function freeTable(id){
  const t=T(id);
  for(const m of (t&&t.merged)||[]) await store.put("tables",m,{status:"free"});
  await store.put("tables",id,{status:"free"});
}

function toast(m){ const el=$("#toast"); el.textContent=m; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2400); }
function modal(html){ $("#sheet").innerHTML=html; $("#overlay").hidden=false; }

      <label class="row" style="font-size:15px">數量 <input id="hQty" type="number" inputmode="numeric" min="1" value="1" style="width:80px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--ground)"></label>
      <p class="muted" style="margin:0;font-size:12px">單價填 0 = 招待,會照樣列在明細上。</p>
      <div class="btns"><button class="btn" data-close>取消</button><button class="btn primary" id="okHidden">加入本輪</button></div>`);

  if(d.bill){ S.bill=d.bill; render(); return; }
  if(d.unmerge){ const id=S.bill, t=T(id), m=d.unmerge; if(!t) return; const rec=t.mergeLog?.[m];

      <div class="btns"><button class="btn" data-close>取消</button><button class="btn primary" id="okSplit">拆桌</button></div>`);
    $("#okSplit").onclick=()=>{ closeModal(); safe(()=>splitTable(id,m),`${baseLabel(m)} 已拆桌`); }; return; }

      $("#okPay").onclick=async()=>{ const ap=$("#autoPrint"); if(ap) lsSet("nx-autoprint",ap.checked);
        const receipt=ap&&ap.checked?billReceipt(id,true,S.method):null; closeModal();
        await safe(async()=>{ await store.put("settles",rid(),{day:bizDay(),at:new Date().toISOString(),table:id,tableLabel:tableLabel(id),people:t.people,session:t.session,
          lines:bl.lines.map(({name,price,q})=>({name,price,q})),food:bl.food,shortfall:bl.shortfall,cork:bl.cork,due:bl.due,method:S.method});

    case "sound": S.sound=!S.sound; lsSet("nx-sound",S.sound); if(S.sound) beep(); render(); break;
    case "cancelTable": await safe(()=>freeTable(S.bill),"已取消開桌"); break;
    case "cancelOpen": { const id=S.sel; await safe(()=>freeTable(id),`${tableLabel(id)} 已取消開桌`); delete carts[id]; saveCarts(); break; }

      const others=tableList().filter(x=>x.id!==id && !(t.merged||[]).includes(x.id) && !mergedInto(x.id));

      document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ const to=b.dataset.pick; closeModal();

        else { const o=T(to);
          if(!o) return safe(()=>mergeTables(id,to),`${baseLabel(to)} 已併入 ${baseLabel(id)}`);
          modal(`<h3>確定併桌?</h3><p class="muted" style="margin:0">${esc(tableLabel(to))}(${o.people} 位,${fmt(tableBill(to).food)} 元)的單會全部移到 ${esc(tableLabel(id))},人數合計 ${t.people+o.people} 位,之後一起結帳。</p>

          $("#okMerge").onclick=()=>{ closeModal(); safe(()=>mergeTables(id,to),`${baseLabel(to)} 已併入 ${baseLabel(id)}`); }; } });

    case "editTables": {
      modal(`<h3>設定</h3><p class="muted" style="margin:0">一行一桌,照店內實際叫法寫。正在用餐的桌子請先結帳再刪。</p>
        <textarea id="tblText">${esc(tableList().map(t=>t.label).join("\n"))}</textarea>
        ${store.mode==="server"?`<div class="btns" style="margin-top:4px"><a class="btn small" href="order?t=${esc(tableList()[0]?.id||"")}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit">預覽客人點餐頁</a><button class="btn small" id="qrBtn">列印桌號 QR code</button></div>`:""}
        <b style="margin-top:6px">常用隱藏品項</b><p class="muted" style="margin:0">一行一項:品名 空一格 價格。時價的品項價格可以不寫,點的時候再輸入。</p>
        <textarea id="hiddenText" style="min-height:110px" placeholder="品名 價格">${esc(hiddenPresets().map(h=>h.name+(h.price!=null?" "+h.price:"")).join("\n"))}</textarea>
        <label class="row"><span>這台電腦的明細紙寬</span><select id="paperSel" style="padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--ground)">${["80","58"].map(w=>`<option value="${w}" ${paperWidth()===w?"selected":""}>${w}mm 熱感紙</option>`).join("")}</select></label>
        <div class="btns"><button class="btn" data-close>取消</button><button class="btn primary" id="okTbl">儲存</button></div>`);

      $("#okTbl").onclick=async()=>{ lsSet("nx-paper",$("#paperSel").value);

        const labels=[...new Set($("#tblText").value.split("\n").map(s=>s.trim()).filter(Boolean))];
        const next=labels.map(l=>old.find(t=>t.label===l)||{id:"t"+String(++n).padStart(2,"0"),label:l});
        const busy=old.filter(t=>(T(t.id)||mergedInto(t.id))&&!next.some(x=>x.id===t.id));
        if(busy.length){ toast(`${busy.map(t=>t.label).join("、")} 還在用餐,不能刪`); return; }
        const hidden=$("#hiddenText").value.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{ const m=x.match(/^(.*?)\s+(\d+)$/); return m?{name:m[1].trim(),price:+m[2]}:{name:x,price:null}; });
        closeModal(); await safe(()=>store.put("config","main",{...(S.config.main||{}),tables:next,hidden}),"設定已儲存"); };
      break; }
    case "addExp": {
      const amt=Number($("#expAmt").value), cat=$("#expCat").value, note=$("#expNote").value.trim();
      if(!(amt>0)){ toast("請輸入支出金額"); return; }
      $("#expAmt").value=""; $("#expNote").value="";
      await safe(()=>store.put("expenses",rid(),{cat,amount:Math.round(amt),note,src:S.expSrc,at:new Date().toISOString(),day:bizDay(),by:lsGet("nx-staff","")}),`已記 ${cat} ${fmt(amt)} 元`); break; }
    case "close": { const list=S.settles.slice(), E=S.expenses.slice(), sh=S.shift, flt=0, cash=cashOf(list), out=drawerOut(), expect=flt+cash-out;
      modal(`<h3>點鈔・關帳</h3>
        <div class="row"><span>現金收款(${list.filter(s=>s.method==="cash").length} 筆)</span><span class="num">${fmt(cash)}</span></div>
        ${out?`<div class="row"><span>− 收銀機付的支出</span><span class="num">${fmt(out)}</span></div>`:""}
        <div class="row big"><span>應收現金</span><span class="num">${fmt(expect)}</span></div>
        <label class="row" style="font-size:15px">實際點鈔 <input id="countIn" type="number" inputmode="numeric" min="0" placeholder="點完的金額" style="width:150px;font-size:18px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--ground)"></label>
        <div id="diffOut" class="row big" style="justify-content:flex-end"></div>
        <input id="diffNote" placeholder="差額原因(選填),例:找錯錢" style="padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--ground)" hidden>
        <p class="muted" style="margin:0;font-size:13px">封存 ${list.length} 筆結帳、${E.length} 筆支出。關帳後這班的明細只留日報彙總。</p>
        <div class="btns"><button class="btn" data-close>還不要</button><button class="btn primary" id="okClose" disabled>確認關帳</button></div>`);
      const cin=$("#countIn"); cin.focus();
      cin.addEventListener("input",()=>{ const ok=cin.value!=="" && Number(cin.value)>=0, diff=Number(cin.value)-expect;
        $("#okClose").disabled=!ok; $("#diffNote").hidden=!ok||diff===0;
        $("#diffOut").innerHTML=!ok?"":diff===0?`<span style="color:var(--ok)">現金相符</span>`:`<span style="color:var(--bad)">${diff>0?"多":"短少"} <span class="num">${fmt(Math.abs(diff))}</span> 元</span>`; });
      $("#okClose").onclick=async()=>{
        const counted=Number(cin.value), note=$("#diffNote").value.trim(), now=new Date().toISOString();
        const shiftRec={float:flt,cashSales:cash,drawerOut:out,expected:expect,counted,diff:counted-expect,note,openedAt:sh?.openedAt||now,closedAt:now,by:sh?.by||""};
        const shiftDay=sh?.day||bizDay();
        closeModal();
        // 依營業日分組,各自併進該日的日報;同一天關過帳又營業時是合併,不會蓋掉
        const groups={}; const g=day=>(groups[day] ||= {S:[],E:[]});
        list.forEach(x=>g(x.day).S.push(x)); E.forEach(x=>g(x.day).E.push(x)); g(shiftDay);
        await safe(async()=>{
          for(const [day,{S:L,E:X}] of Object.entries(groups)){
            const prev=S.days.find(x=>x.id===day)||{};
            const items=Object.fromEntries(prev.items||[]), itemAmt=Object.fromEntries(prev.itemAmt||[]), byMethod={...(prev.byMethod||{})};
            L.forEach(x=>{ byMethod[x.method]=(byMethod[x.method]||0)+x.due; x.lines.forEach(l=>{ items[l.name]=(items[l.name]||0)+l.q; itemAmt[l.name]=(itemAmt[l.name]||0)+l.price*l.q; }); });
            await store.put("days",day,{revenue:(prev.revenue||0)+L.reduce((a,x)=>a+x.due,0),covers:(prev.covers||0)+L.reduce((a,x)=>a+x.people,0),
              count:(prev.count||0)+L.length,byMethod,items:Object.entries(items).sort((a,b)=>b[1]-a[1]),itemAmt:Object.entries(itemAmt),closedAt:now,
              expenseTotal:(prev.expenseTotal||0)+X.reduce((a,e)=>a+e.amount,0),
              expenses:[...(prev.expenses||[]),...X.map(({cat,amount,note,src,at})=>({cat,amount,note,src,at}))],
              shifts:[...(prev.shifts||[]),...(day===shiftDay?[shiftRec]:[])],
              settles:[...(prev.settles||[]),...L.map(({at,tableLabel,people,due,method})=>({at,tableLabel,people,due,method}))]});
          }
          const live=new Set(Object.values(S.tables).filter(t=>t.status==="dining").map(t=>t.session));
          for(const x of list) await store.del("settles",x.id);
          for(const x of E) await store.del("expenses",x.id);
          for(const o of S.orders) if(!live.has(o.session)) await store.del("orders",o.id);
          if(sh) await store.del("shift","current");
        }, counted===expect?"已關帳,現金相符":`已關帳,現金${counted>expect?"多":"短少"} ${fmt(Math.abs(counted-expect))} 元`); };
      break; }
  }
});

/* ============ 拖曳併桌 ============ */
const drag={src:null,x:0,y:0,on:false,ghost:null,over:null,justDropped:false};
document.addEventListener("pointerdown",e=>{
  if(e.pointerType!=="mouse"||e.button!==0) return;
  const card=e.target.closest(".floor .tcard"); if(!card) return;
  Object.assign(drag,{src:card.dataset.tid,x:e.clientX,y:e.clientY,on:false});
});
document.addEventListener("pointermove",e=>{
  if(!drag.src) return;
  if(!drag.on){ if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8) return;
    drag.on=true; drag.ghost=document.createElement("div"); drag.ghost.className="drag-ghost";
    drag.ghost.textContent=tableLabel(mergedInto(drag.src)||drag.src)+" → 拖到要併的桌"; document.body.appendChild(drag.ghost);
    document.querySelector(`.tcard[data-tid="${drag.src}"]`)?.classList.add("drag-src"); }
  drag.ghost.style.left=e.clientX+"px"; drag.ghost.style.top=e.clientY+"px";
  const over=document.elementFromPoint(e.clientX,e.clientY)?.closest(".floor .tcard");
  document.querySelectorAll(".tcard.drop-ok").forEach(x=>x.classList.remove("drop-ok"));
  drag.over=over&&over.dataset.tid!==drag.src?over.dataset.tid:null;
  if(drag.over) over.classList.add("drop-ok");
});
document.addEventListener("pointerup",()=>{
  if(!drag.src) return;
  const {src,over,on}=drag; drag.src=null; drag.on=false; drag.ghost?.remove(); drag.ghost=null;
  document.querySelectorAll(".drag-src,.drop-ok").forEach(x=>x.classList.remove("drag-src","drop-ok"));
  if(!on) return;
  drag.justDropped=true; setTimeout(()=>drag.justDropped=false,50);   // 放開時不要順便觸發點選
  if(over) dropTable(src,over); else render();
});
document.addEventListener("click",e=>{ if(drag.justDropped&&e.target.closest(".floor")){ e.stopImmediatePropagation(); e.preventDefault(); } },true);

function dropTable(a,b){
  const src=mergedInto(a)||a, dst=mergedInto(b)||b;
  if(mergedInto(a)){ toast(`${baseLabel(a)} 已經併在 ${baseLabel(src)},要移開請先拆桌`); return; }
  if(src===dst){ toast("已經是同一桌了"); return; }
  const s=T(src), d=T(dst);
  if(!s&&!d){ toast("兩桌都是空桌,先開其中一桌再併"); return; }
  if(!s){ return safe(()=>mergeTables(dst,src),`${baseLabel(src)} 已併入 ${baseLabel(dst)}`).then(()=>{ S.bill=dst; render(); }); }
  if(!d){
    modal(`<h3>${esc(tableLabel(src))} 拖到 ${esc(baseLabel(dst))}</h3><p class="muted" style="margin:0">${esc(baseLabel(dst))} 是空桌,要怎麼處理?</p>
      <div class="btns"><button class="btn" id="dMove">整桌換過去</button><button class="btn primary" id="dMerge">把 ${esc(baseLabel(dst))} 併進來</button></div>
      <button class="btn small" data-close>取消</button>`);
    $("#dMove").onclick=()=>{ closeModal(); safe(()=>moveTable(src,dst),`已換到 ${baseLabel(dst)}`).then(()=>{ S.bill=dst; if(S.sel===src) S.sel=dst; render(); }); };
    $("#dMerge").onclick=()=>{ closeModal(); safe(()=>mergeTables(src,dst),`${baseLabel(dst)} 已併入 ${baseLabel(src)}`).then(()=>{ S.bill=src; render(); }); };
    return;
  }
  modal(`<h3>併桌?</h3><p class="muted" style="margin:0">把 ${esc(tableLabel(src))}(${s.people} 位,${fmt(tableBill(src).food)} 元)併到 ${esc(tableLabel(dst))}(${d.people} 位),合計 ${s.people+d.people} 位,之後一起結帳。併錯可以在明細按「拆桌」還原。</p>
    <div class="btns"><button class="btn" data-close>取消</button><button class="btn primary" id="dOk">併桌</button></div>`);
  $("#dOk").onclick=()=>{ closeModal(); safe(()=>mergeTables(dst,src),`${baseLabel(src)} 已併入 ${baseLabel(dst)}`).then(()=>{ S.bill=dst; render(); }); };
}

let audioCtx=null;
function beep(){ try{ audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
  [0,0.18].forEach(t=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.2,audioCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+t+0.15); o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.16); }); }catch(e){} }

/* ============ 桌號 QR code ============ */
async function showQr(){
  let info; try{ const r=await fetch("api/info",{headers:{"X-PIN":lsGet("nx-pin","")}}); info=await r.json(); }catch(e){}
  if(!info||!info.ips){ toast("拿不到店裡電腦的網址,請在店裡電腦上操作"); return; }
  const ips=info.ips.length?info.ips:[location.hostname];
  const draw=ip=>{ const base=`http://${ip}:${info.port}/order?t=`;
    return tableList().map(t=>{ const q=qrcode(0,"M"); q.addData(base+t.id); q.make();
      return `<div class="qrcard"><div class="qrshop">鳥璇</div><div class="qrtbl">${esc(t.label)}</div>${q.createSvgTag({cellSize:5,margin:2,scalable:true})}<div class="qrhint">掃描 QR code 點餐<br>請先連上店內 Wi-Fi</div><div class="qrurl">${esc(base+t.id)}</div></div>`; }).join(""); };
  modal(`<h3>桌號 QR code</h3>
    <p class="muted" style="margin:0;font-size:13px">客人用手機掃了會直接打開這一桌的點餐頁。<b>客人的手機要連店內 Wi-Fi</b>,連 4G/5G 打不開。</p>
    <div class="warnbox">QR code 裡寫的是這台電腦的網址。電腦重開機或換網路,網址可能會變,印好的 QR 就失效了。
      請網路廠商在路由器幫這台電腦設「固定 IP」,之後再印。</div>
    ${ips.length>1?`<label class="row">電腦網址 <select id="qrIp" style="padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--ground)">${ips.map(ip=>`<option>${ip}</option>`).join("")}</select></label>`:`<div class="row"><span>電腦網址</span><span class="num">${esc(ips[0])}:${info.port}</span></div>`}
    <p class="muted" style="margin:0;font-size:12px">點任一張可以打開那桌的客人點餐頁看看。</p>
    <div id="qrPrev" class="qrgrid qrprev">${draw(ips[0])}</div>
    <div class="btns"><button class="btn" data-close>關閉</button><button class="btn primary" id="qrPrint">列印</button></div>`);
  const cur=()=>$("#qrIp")?$("#qrIp").value:ips[0];
  if($("#qrIp")) $("#qrIp").onchange=()=>{ $("#qrPrev").innerHTML=draw(cur()); };
  $("#qrPrev").addEventListener("click",e=>{ const c=e.target.closest(".qrcard"); if(c) window.open(c.querySelector(".qrurl").textContent,"_blank"); });
  $("#qrPrint").onclick=()=>{ $("#print").className="qrsheet"; $("#print").innerHTML=`<div class="qrgrid">${draw(cur())}</div>`;
    closeModal(); setTimeout(()=>{ window.print(); $("#print").className=""; },50); };
}

/* ============ 啟動 ============ */
function subscribeAll(){
  store.watch("tables",docs=>{ S.tables=Object.fromEntries(docs.map(d=>[d.id,d])); render(); });
  let seen=null;
  store.watch("orders",docs=>{ S.orders=docs;
    const ids=new Set(docs.filter(o=>o.status==="pending").map(o=>o.id));
    const fresh=seen?docs.filter(o=>ids.has(o.id)&&!seen.has(o.id)):[];
    if(fresh.length){ const g=fresh.find(o=>o.guest);
      if(g) toast(`${g.tableLabel} 客人自己點了第 ${g.round} 輪`); else if(S.tab==="kitchen") toast("新單進來了");
      if(S.sound&&(S.tab==="kitchen"||g)) beep(); }
    seen=ids; render(); });
  store.watch("settles",docs=>{ S.settles=docs; render(); });
  store.watch("days",docs=>{ S.days=docs; render(); });
  store.watch("shift",docs=>{ S.shift=docs.find(d=>d.id==="current")||null; render(); });
  store.watch("expenses",docs=>{ S.expenses=docs; render(); });
  store.watch("config",docs=>{ S.config=Object.fromEntries(docs.map(d=>[d.id,d])); render(); });
}
render();
(async()=>{
  if(location.protocol.startsWith("http") && !location.hostname.endsWith("claude.ai")){
    try{ const r=await fetch("api/state",{cache:"no-store",headers:{"X-PIN":lsGet("nx-pin","")}});
      if(r.status===401||r.status===429){ store.mode="server"; askPin(r.status===429?(await r.json()).error:""); return; }
      if(r.ok){ const st=await r.json(); if(st.data){
      store.mode="server"; setConn("shared","店內連線 · 同步中"); subscribeAll(); store._apply(st);
      Object.entries(store.subs).forEach(([c,cb])=>cb(store._docs(st.data,c))); setTimeout(()=>store._poll(),1500); return; } } }catch(e){}
  }
  const db = window.claude?.use ? await window.claude.use("db") : null;
  if(db){ store.db=db; store.mode="shared"; setConn("shared","共用 · 即時同步"); }
  else setConn("local","單機模式");
  subscribeAll();
})();
</script>
